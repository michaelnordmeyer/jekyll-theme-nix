<style>
  :root {
    --font-size: 1rem;
    /* Calculate integer pixel values depending on the font size (default: 1rem = 16px) */
    --border-size: calc(var(--font-size) * 1/16);
    --x-script: calc(var(--font-size) * 11/16);
    --font-size-small: calc(var(--font-size) * 14/16);
    --font-size-big: calc(var(--font-size) * 32/16);
    --font-family: sans-serif;
    --spacing: 1em;
    --line-height: 1.5;
    --line-height-reduced: 1.2;
  }
  html {
    max-width: 720px;
    margin: 0 auto;
    padding: calc(var(--spacing) * 1 / 2);
    font: var(--font-size) / var(--line-height) var(--font-family);
    /* font-size-adjust: from-font; */
    -moz-text-size-adjust: none;
    -webkit-text-size-adjust: none;
    text-size-adjust: none;
  }
  body {
    margin: 0;
  }
  img,
  table {
    margin: 0 auto;
  }
  table {
    border-collapse: collapse;
  }
  th,
  td {
    padding: calc(var(--spacing) * 1 / 4);
    border: var(--border-size) solid
      color-mix(in srgb, currentcolor 50%, transparent);
  }
  img {
    display: block;
    max-width: 100%;
    height: auto;
  }
  figure {
    margin-left: 0;
    margin-right: 0;
    max-width: 100%;
    text-align: center;
    font-size: var(--font-size-small);
    line-height: 1;
  }
  blockquote {
    margin: var(--spacing) calc(var(--spacing) * 3 / 2) var(--spacing)
      calc(var(--spacing) * 1 / 2);
    padding-left: var(--spacing);
    border-left: var(--border-size) solid
      color-mix(in srgb, currentcolor 50%, transparent);
  }
  pre {
    overflow-x: auto;
    tab-size: 2;
  }
  sub,
  sup {
    font-size: var(--x-script);
    line-height: 0;
  }
  hr {
    margin: calc(var(--spacing) * 2) 0;
    border: 0;
    border-top: var(--border-size) solid;
  }
  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    line-height: var(--line-height-reduced);
    text-wrap: balance;
  }
  h1 {
    margin-block: 0.67em;
    font-size: var(--font-size-big);
  }
  body > header > nav > h1 {
    margin-bottom: var(--spacing);
    text-align: center;
    line-height: var(--line-height-reduced);
  }
  body > header a {
    text-decoration: none;
    color: currentcolor;
  }
  body > header > nav > a {
    display: block;
    margin-block-start: calc(var(--spacing) * 2 / 3);
    margin-block-end: var(--spacing);
    text-align: center;
    font-size: var(--font-size-big);
    font-weight: bold;
    line-height: var(--line-height-reduced);
  }
  body > header a:visited {
    color: currentcolor;
  }
  body > main > section > ul {
    padding: 0;
  }
  body > main > section > ul > li {
    margin: calc(var(--spacing) * 1 / 2) 0;
    list-style-type: none;
    line-height: 1.25;
  }
  body > main > section > ul > li time {
    font-size: var(--font-size-small);
  }
  article > header {
    margin-bottom: calc(var(--spacing) * 2);
  }
  article > header > h1 {
    margin-bottom: 0;
  }
  header > time {
    display: block;
    color: color-mix(in srgb, currentcolor 50%, transparent);
  }
  hr:has(+ div[role="doc-endnotes"]) {
    margin-bottom: var(--spacing);
  }
  div[role="doc-endnotes"] {
    margin-top: 0;
    font-size: var(--font-size-small);
    line-height: var(--line-height);
  }
</style>
